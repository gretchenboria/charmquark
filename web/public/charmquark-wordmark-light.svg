<svg width="300" height="64" viewBox="0 0 300 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CharmQuark">
  <!-- Light variant: for dark surfaces. The violet end of the brand gradient
       loses contrast on a dark ground, so both ramps are lifted toward lilac. -->
  <defs>
    <linearGradient id="wG" x1="8" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A9F0"/>
      <stop offset="0.52" stop-color="#A9A6E8"/>
      <stop offset="1" stop-color="#8FC0F5"/>
    </linearGradient>
    <!-- The wordmark carries the same sweep as the mark, across the whole word. -->
    <linearGradient id="wT" x1="76" y1="0" x2="292" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A9F0"/>
      <stop offset="0.5" stop-color="#B9B4EE"/>
      <stop offset="1" stop-color="#8FC0F5"/>
    </linearGradient>
    <radialGradient id="wN" cx="0.34" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#B79BE8"/>
      <stop offset="0.45" stop-color="#6D42B8"/>
      <stop offset="1" stop-color="#34206B"/>
    </radialGradient>
  </defs>

  <g transform="translate(6 6) scale(0.406)">
    <g fill="none" stroke="url(#wG)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 12 L107 37 L107 91 L64 116 L21 91 L21 37 Z" stroke-width="7"/>
      <path d="M40 52 L88 52 M40 52 L64 100 M88 52 L64 100" stroke-width="3.6" opacity="0.6"/>
      <ellipse cx="64" cy="64" rx="42" ry="21" stroke-width="4" opacity="0.85" transform="rotate(-30 64 64)"/>
      <ellipse cx="64" cy="64" rx="42" ry="21" stroke-width="4" opacity="0.85" transform="rotate(30 64 64)"/>
    </g>
    <g>
      <circle cx="64" cy="34" r="11" fill="url(#wN)"/>
      <circle cx="64" cy="64" r="12.5" fill="url(#wN)"/>
      <circle cx="40" cy="86" r="11" fill="url(#wN)"/>
      <circle cx="88" cy="86" r="11" fill="url(#wN)"/>
    </g>
  </g>

  <text x="76" y="41" font-family="'Avenir Next','Futura','Century Gothic',system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="27" font-weight="700" letter-spacing="1.6" fill="url(#wT)">CHARMQUARK</text>
</svg>
