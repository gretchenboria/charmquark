<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CharmQuark">
  <!-- Favicon / small-size variant. The full mark's lattice and orbitals collapse
       into noise below ~48px, so this keeps only what survives: the hexagon and
       the three quarks, on a solid brand tile for contrast in a browser tab. -->
  <defs>
    <linearGradient id="t" x1="4" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28A8"/>
      <stop offset="0.52" stop-color="#5A4CA0"/>
      <stop offset="1" stop-color="#3576C2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#t)"/>
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round">
    <path d="M32 13 L49 23 L49 43 L32 53 L15 43 L15 23 Z" stroke-width="3" opacity="0.62"/>
    <path d="M32 22 L22 41 M32 22 L42 41 M22 41 L42 41" stroke-width="2.6" opacity="0.42"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="32" cy="22" r="6"/>
    <circle cx="22" cy="41" r="6"/>
    <circle cx="42" cy="41" r="6"/>
  </g>
</svg>
