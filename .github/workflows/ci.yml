name: CI

# The gate every change passes before it can reach production: deploy.yml calls
# this workflow and only deploys when every job here is green.
on:
  pull_request:
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Same public build-time values as production, so CI builds what ships.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

  smoke:
    # The API on a real local D1, driven through its routes: validation,
    # If-Match/409, audit, API tokens, permission gates. See api/scripts/smoke.sh.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Workers AI bindings always resolve remotely, even under `wrangler dev`.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:local && npm run db:seed:local
      - name: Start the Worker
        run: |
          npx wrangler dev --port 8787 --var ENVIRONMENT:development > wrangler-dev.log 2>&1 &
          curl -s --retry 60 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8787/health
      - run: npm run smoke
      - if: failure()
        run: tail -100 wrangler-dev.log

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brand — no cyan or teal (docs/BRAND.md)
        run: |
          if grep -rnE '(bg|text|border|ring)-(teal|cyan|sky)-' web/src; then
            echo "::error::cyan/teal/sky utility classes are not allowed (docs/BRAND.md)"
            exit 1
          fi

      - name: Migrations are append-only
        # D1 records applied migrations by filename. Editing or deleting one that
        # has shipped leaves every existing database silently out of step with
        # the code — add a new migration instead.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- db/migrations || true)
          if [ -n "$changed" ]; then
            echo "::error::existing migrations were modified, renamed or deleted:"
            echo "$changed"
            exit 1
          fi
